<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Set Level 7</title>
    <style>
      .progress-container{
       *{padding: 0; margin: 0;}
        width: 100%;
        height: 20px;
        background-color: lightblue;
        border: solid green;
        border-radius: 25px;
      }
      .progress-bar{
        width: 150px;
        height: 20px;
        background-color: purple;
        border-radius: 20px;
        animation: animation-progress 2s ;
      }
      @keyframes animation-progress {
       0% {width: 0%;}
        90%{width: 95%;}
        95%{width: 70%;}
        100%{width: 100%;}
      }
    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>
</html>
