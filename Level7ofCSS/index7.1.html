<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Transform Property</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
            border: 3px solid black;
            border-radius: 10px;
            text-align: center;
            background-color:lightpink;
            position: relative;
            top: 50px;
            left:50px;
            transition: all 2s ease-in;
        }
        .box:hover{
            /* transform: rotate(45deg); */
            /* transform: rotatex(45deg); */
            transform: rotatey(45deg);
            /* transform: rotate(45deg); */
            /* transform: rotatex(45deg); */
            /* transform: rotatey(45deg); */
            /* transform: scale(0.5);This is scale property */
            /* transform: translate(60px);This is Translate property */
            /* transform: skew(45deg);This is skew property */
        }
    </style>
</head>
<body>
    <div class="box">Rotate</div>
</body>
</html>
