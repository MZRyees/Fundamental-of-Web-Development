<!DOCTYPE html>
<html lang="en">
<head>
    <title>Height and Width</title>
    <style>
        #box1{
            height: 40px;
            width: 40px;
            background-color:navajowhite;
        }
        .icon{
            height: 200px;
            width: 200px;
            background-image: url(logo.jpg.jpeg);
            background-size: contain;
            background-repeat: no-repeat;
        }
        .box3{
            background-color: blue;
            width: 80px;
            height: 60px;
        }
        #box4{
            background-color: red;
            visibility: visible;
            width: 100px;
            height: 80px;
        }
    </style>
</head>
<body>
    <div id="box3">Box1</div><hr>
    <div class="icon"></div>
    <div class="box3">This is box3</div><hr>
    <div id="box4">This is box 2</div>
</body>
</html>
