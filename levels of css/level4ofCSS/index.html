<!DOCTYPE html>
<html lang="en">
<head>  
    <title>Padding Property</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        #button{
            color: brown;
            background-color: purple;
            height: 50px;
            width: 50px;
            padding: 4px 4px 4px 4px;
            margin: 5px 5px 5px 5px;
            border: 3px dashed yellow;
            box-sizing: border-box;
        }
        .pad{
            height: 40px;
            width: 40px;
            padding: 8px;
        }
         #button2{
            color: rgb(42, 165, 44);
            background-color: rgb(0, 111, 128);
            margin: 5px 5px 5px 5px;
            border: 2px solid;
            border-radius: 10px;
            box-sizing: content-box;
         }
    </style>
</head>
<body>
    <div id="button" class="pad">Click Me</div>
    <div id="button2" class="pad">pocked me<div>
</body>
</html>
